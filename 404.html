<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Página não encontrada — Flowlance</title>
<meta name="description" content="A página que você buscou não foi encontrada. Volte para a página inicial do Flowlance.">
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="/flowlance-logo-transparent.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{--y:#F5C842;--dk:#0E0E0E;--gr:#6B7280;--br:#E5E7EB}
body{font-family:'Geist',sans-serif;background:#fff;color:var(--dk);min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 20px;text-align:center}
.logo{display:flex;align-items:center;gap:8px;margin-bottom:48px;text-decoration:none;color:var(--dk)}
.logo img{width:32px;height:32px;object-fit:contain}
.logo span{font-size:20px;font-weight:800;letter-spacing:-0.5px}
.num{font-size:clamp(80px,20vw,140px);font-weight:800;letter-spacing:-4px;line-height:1;color:var(--dk);margin-bottom:16px}
.num span{color:var(--y)}
h1{font-size:clamp(22px,5vw,32px);font-weight:800;letter-spacing:-0.8px;margin-bottom:12px}
p{font-size:16px;color:var(--gr);max-width:400px;line-height:1.6;margin-bottom:36px}
.btn{display:inline-block;padding:14px 32px;background:var(--dk);color:#fff;text-decoration:none;border-radius:10px;font-size:15px;font-weight:700;font-family:'Geist',sans-serif;transition:opacity .15s}
.btn:hover{opacity:.85}
</style>
</head>
<body>
<a href="/" class="logo">
  <img src="/flowlance-logo-transparent.png" alt="Flowlance">
  <span>Flowlance</span>
</a>
<div class="num">4<span>0</span>4</div>
<h1>Página não encontrada</h1>
<p>Essa URL não existe ou foi movida. Volte para a página inicial e tente novamente.</p>
<a href="/" class="btn">Voltar para o início →</a>
</body>
</html>
